syntax = "proto3";

package hft;

option java_package = "com.hft.grpc.proto";
option java_multiple_files = true;
option java_outer_classname = "SignalProto";

import "hft/common.proto";

// ─── Requests ──────────────────────────────────────────────────────────────

message RecommendationRequest {
  string      symbol = 1;
  MarketProto market = 2;
}

message ScreenerRequest {
  MarketProto            market               = 1;
  double                 min_confidence       = 2;
  repeated SignalTypeProto signals            = 3;
  RiskLevelProto         max_risk_level       = 4;
  double                 min_technical_score  = 5;
  double                 min_fundamental_score = 6;
  repeated string        sectors             = 7;
  int32                  limit               = 8;
}

// ─── Messages ──────────────────────────────────────────────────────────────

message TradeRecommendationProto {
  string          id                     = 1;
  string          symbol                 = 2;
  string          company_name           = 3;
  MarketProto     market                 = 4;
  AssetTypeProto  asset_type             = 5;
  string          sector                 = 6;
  string          sector_outlook         = 7;
  SignalTypeProto signal                 = 8;
  TimeHorizonProto time_horizon          = 9;
  RiskLevelProto  risk_level             = 10;
  double          current_price          = 11;
  double          entry_price            = 12;
  string          entry_price_range      = 13;
  double          target_price           = 14;
  double          stop_loss_price        = 15;
  double          expected_profit_pct    = 16;
  double          max_risk_pct           = 17;
  double          risk_reward_ratio      = 18;
  int32           holding_period_days    = 19;
  double          composite_score        = 20;
  double          confidence_pct         = 21;
  double          technical_score        = 22;
  double          fundamental_score      = 23;
  double          sentiment_score        = 24;
  double          macro_score            = 25;
  double          ml_score               = 26;
  repeated string key_reasons           = 27;
  repeated string key_risks             = 28;
  repeated string related_news          = 29;
  repeated string data_sources          = 30;
  int64           generated_at_ms       = 31;
  int64           valid_until_ms        = 32;
  string          status                = 33;  // ACTIVE / CLOSED / EXPIRED / TRIGGERED
  string          rank                  = 34;  // TOP_1, TOP_2, …
}

message ScreenerResponse {
  repeated TradeRecommendationProto recommendations = 1;
  int32 total_count = 2;
}

// ─── Service ───────────────────────────────────────────────────────────────

service SignalService {
  // Single recommendation for a specific symbol
  rpc GetRecommendation (RecommendationRequest) returns (TradeRecommendationProto);

  // Screen stocks matching criteria
  rpc ScreenStocks (ScreenerRequest) returns (ScreenerResponse);

  // Server-streaming: push new signals as they're generated by Kafka
  rpc StreamSignals (RecommendationRequest) returns (stream TradeRecommendationProto);
}