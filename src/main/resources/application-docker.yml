# ─── DOCKER PROFILE ──────────────────────────────────────────────────────────
# Layers real infra (MySQL, ClickHouse, Redis, Kafka) on top of the "dev"
# profile's H2/no-broker defaults. Activate alongside "dev", not instead of it:
#   SPRING_PROFILES_ACTIVE=dev,docker,secrets ./gradlew bootRun
#
# Requires `docker compose up -d --wait` first (see docker-compose.yml).
# gradle test / plain "dev" is untouched by this file — it's opt-in only.

spring:
  datasource:
    # host port 3307 -> container 3306 (something else on this machine already holds 3306)
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE:hft_market_intelligence}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_APP_USER:hft_app}
    password: ${MYSQL_APP_PASSWORD:hft_dev_password}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  h2:
    console:
      enabled: false

  data:
    redis:
      host: localhost
      port: 6380   # host 6380 -> container 6379 (an unrelated container already holds 6379)
      password: ${REDIS_PASSWORD:hft_dev_redis}

  cache:
    type: redis

  kafka:
    listener:
      auto-startup: true     # a real broker is up now — start the consumers
    streams:
      auto-startup: true

hft:
  clickhouse:
    enabled: true
    jdbc-url: jdbc:clickhouse://localhost:8123/${CLICKHOUSE_DATABASE:hft_analytics}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:hft_dev_clickhouse}

  redis-pubsub:
    enabled: true

management:
  health:
    redis:
      enabled: true
