spring:
  application:
    name: hft-market-intelligence
  profiles:
    active: dev

  # ─── JPA ────────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # ─── Jackson ────────────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL
    time-zone: UTC

  # ─── Cache ──────────────────────────────────────────────────────────────────
  cache:
    type: simple        # 'redis' in prod, 'simple' for dev without Redis

  # ─── Kafka Streams ───────────────────────────────────────────────────────────
  kafka:
    streams:
      application-id: hft-market-intelligence-streams
      # Default serdes — topology overrides these per-stream with JSON serdes
      properties:
        default.key.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        default.value.serde: org.apache.kafka.common.serialization.Serdes$StringSerde
        # Low latency: process immediately without batching
        commit.interval.ms: 100
        cache.max.bytes.buffering: 0
        # Tolerate broker unavailability on startup (matched with fail-fast=false)
        num.stream.threads: 2

  # ─── GraphQL ─────────────────────────────────────────────────────────────────
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    websocket:
      path: /graphql-ws          # Subscription endpoint
    schema:
      printer:
        enabled: true            # GET /graphql/schema prints the SDL
    path: /graphql

# ─── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ─── Actuator ───────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ─── SpringDoc / Swagger ─────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# ─── HFT Platform Configuration ──────────────────────────────────────────────
hft:
  # Stage 4 — GraphQL safety limits
  graphql:
    max-query-depth: 10       # reject queries nested deeper than 10 levels
    max-query-complexity: 200 # reject queries whose field-count exceeds 200

  # Stage 4 — Redis Pub/Sub fan-out (disabled in dev, enabled in prod)
  redis-pubsub:
    enabled: false

  # Stage 6 — Backtesting
  backtest:
    interval-type: 1D              # OHLCV bar interval to use for simulation
    kafka-capture:
      enabled: false               # capture signals-ml-scored → backtest-results topic

  # Stage 5 — ML A/B model routing
  ml:
    model-router:
      model-b-fraction: 0.10       # 10% of symbols route to Model B (EnsembleModel)
    ensemble:
      momentum-weight: 0.33
      reversion-weight: 0.33
      trend-weight: 0.34
  # API Keys — set real keys in application-dev.yml or environment variables
  alpha-vantage:
    api-key: ${ALPHA_VANTAGE_API_KEY:demo}
    base-url: https://www.alphavantage.co/query
    rate-limit-per-minute: 5          # free tier burst limit (~1 req/sec)
    # Free tier is 25 requests/day, TOTAL, shared across every function (GLOBAL_QUOTE,
    # NEWS_SENTIMENT, TIME_SERIES_DAILY_ADJUSTED) — confirmed directly against the API's own
    # rate-limit response (see docs/STAGE9_INFRASTRUCTURE.md §6), not the "500/day" this
    # comment used to (incorrectly) say. AlphaVantageBudgetGuard (Stage 12) enforces this;
    # daily-call-budget leaves headroom below the hard 25 so occasional manual/ad-hoc calls
    # against the same key don't get starved by the scheduled poller.
    daily-call-budget: 20

  # NOTE: configured but NOT actually implemented — no MarketDataService exists for this yet
  # (only AlphaVantageService for US, NSEIndiaService for India). Left here as a placeholder
  # for when/if a real Yahoo Finance integration is built; enabled:true has no effect today.
  yahoo-finance:
    base-url: https://query1.finance.yahoo.com
    enabled: true

  nse-india:
    base-url: https://www.nseindia.com/api
    enabled: true
    user-agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"

  newsapi:
    api-key: ${NEWSAPI_API_KEY:}
    base-url: https://newsapi.org/v2
    enabled: true    # safe: fetchNewsApi() no-ops when api-key is blank

  twitter:
    bearer-token: ${TWITTER_BEARER_TOKEN:}
    enabled: false    # deferred — no free tier, budget decision (see HFT_ARCHITECTURE.md §24.2)

  reddit:
    client-id: ${REDDIT_CLIENT_ID:}
    client-secret: ${REDDIT_CLIENT_SECRET:}
    enabled: true    # safe: no-ops when client-id/secret are blank

  fred:
    api-key: ${FRED_API_KEY:}
    base-url: https://api.stlouisfed.org/fred
    enabled: true    # safe: fetchFredLatestValue() no-ops when api-key is blank

  # Phase 0b — real intelligence sources (HFT_ARCHITECTURE.md §24.2), all free/no-key
  stocktwits:
    base-url: https://api.stocktwits.com/api/2
    enabled: true

  sec-edgar:
    base-url: https://efts.sec.gov/LATEST/search-index
    user-agent: "HFT-Market-Intelligence-Platform research@hmip.local"   # SEC EDGAR fair-access policy requires an identifying UA
    enabled: true

  gdelt:
    base-url: https://api.gdeltproject.org/api/v2
    enabled: true

  rbi-nse:
    rbi-base-url: https://api.rbi.org.in
    nse-base-url: https://www.nseindia.com/api
    enabled: true

  screener-in:
    base-url: https://www.screener.in/api
    enabled: true

  # Stage 11 — ONNX model serving (DJL + ONNX Runtime). No model bundled — model-path is
  # empty by default, and OnnxModelService no-ops gracefully everywhere until a real .onnx
  # file (batch-1, 41-float input, single 0-100-scale scalar output) is configured. See
  # docs/STAGE11_ONNX_SERVING.md.
  onnx:
    enabled: true
    model-path: ""

  # Stage 10 — Adaptive Source Reliability Bandit (ASRB), wired live into
  # SentimentAnalysisService. docs/ASRB_TECHNICAL_DISCLOSURE.md §10 explicitly leaves these
  # uncalibrated pending real backtest data — these are structural starting defaults, not
  # claimed-final constants. Kill switch: enabled:false reverts to the pre-Stage-10 flat
  # 0.6/0.4 news/social blend everywhere, with zero other behavior change.
  asrb:
    enabled: true
    lambda-corr: 0.97        # correlation EWMA decay — closer to 1 = longer memory
    kappa: 0.5                # correlation-discount sensitivity, (0,1]
    lambda-time: 0.99         # posterior temporal forgetting — slower than lambda-corr;
                               # reliability is a more stable property than moment-to-moment correlation
    prior-precision: 1.0       # weak/diffuse Bayesian prior on the reliability posterior
    rho-threshold: 0.3         # below this pairwise correlation, a co-reporting source counts independent
    w1: 2.0                    # misinfo-risk weight: (1 - credibility)
    w2: 0.5                    # misinfo-risk weight: claim-velocity anomaly
    w3: 0.7                    # misinfo-risk weight: independent-corroboration count (reduces risk)
    v0: 1.5                    # velocity z-score baseline before it contributes to risk
    tau-risk: 0.7              # narrative-risk-alert threshold on MisinfoRisk
    tau-velocity: 2.0          # narrative-risk-alert threshold on claim-velocity z-score
    risk-aversion: 0.6         # how much misinfo risk discounts evidence weight, (0,1]
    tau-stability: 0.6         # population-relative-stability gate: >= this uses Gittins, else Thompson
    gittins-z: 1.5             # UCB-style exploration bonus multiplier on the Gittins index

  # Stage 9c — ClickHouse analytics store (trade-signal / transaction history).
  # Off by default: only "docker" (local) and "prod" turn this on, since it
  # requires a live ClickHouse instance. See docker-compose.yml.
  clickhouse:
    enabled: false

  # Market Hours (IST timezone stored here)
  market:
    us:
      open-time: "09:30"
      close-time: "16:00"
      timezone: "America/New_York"
    india:
      open-time: "09:15"
      close-time: "15:30"
      timezone: "Asia/Kolkata"

  # Analysis Settings
  analysis:
    technical:
      rsi-period: 14
      macd-fast: 12
      macd-slow: 26
      macd-signal: 9
      bb-period: 20
      bb-std-dev: 2.0
      atr-period: 14
      sma-periods: [20, 50, 200]
      ema-periods: [9, 21, 55]
    sentiment:
      refresh-interval-minutes: 15
    fundamental:
      refresh-interval-hours: 24

  # Recommendation Settings
  recommendation:
    composite-weights:
      technical: 0.35
      fundamental: 0.25
      sentiment: 0.20
      macro: 0.15
      ml: 0.05
    min-confidence-for-buy: 65.0
    min-liquidity-avg-volume: 100000
    min-market-cap-india-crores: 500
    min-market-cap-us-billion: 1.0
    min-risk-reward-ratio: 2.0
    top-recommendations-count: 5

  # Virtual portfolio tracker (Stage 13, §30) — never executes trades, only watches positions
  # the user tells us they already bought elsewhere and alerts on target/stop-loss/deteriorating
  # signal. monitor-poll-ms is a real cost tradeoff: each open position re-runs a full
  # recommendation (real external API calls) every cycle — see PortfolioMonitorService.
  portfolio:
    monitor-enabled: true
    monitor-poll-ms: 900000   # 15 min

  # Scheduling
  scheduler:
    market-data-poll-ms: 500
    ta-compute-interval-ms: 60000
    sentiment-refresh-cron: "0 */15 * * * *"
    daily-report-cron: "0 0 8 * * MON-FRI"
    ipo-open-rescore-cron: "0 */15 * * * *"    # OPEN IPOs re-score every 15 min during subscription window
    ipo-daily-rescore-cron: "0 0 8 * * *"      # UPCOMING IPOs re-score once daily

  # IPO Buy/Sell Decision Engine (§22) — no real SEBI/SEC IPO ingestion exists yet
  ipo:
    seed-sample-data:
      enabled: true    # 3 sample IPOData rows so the endpoints return something real to test

  # JWT
  jwt:
    secret: ${JWT_SECRET:hft-platform-secret-key-change-in-production-min-256-bit}
    expiration-ms: 900000         # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days

  # Admin-managed platform API credential encryption (any-length string, SHA-256 derived to AES-256)
  admin:
    secrets-key: ${ADMIN_SECRETS_KEY:hft-platform-admin-secrets-key-change-in-production}

  # Seeds one USER+ADMIN test account (PTD2315) on startup if it doesn't already exist
  identity:
    seed-test-user:
      enabled: true

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.hft: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"