<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMIP — Market Intelligence</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<script>
(function () {
  var stored = localStorage.getItem('hmip.theme');
  if (stored === 'light' || stored === 'dark') {
    document.documentElement.setAttribute('data-theme', stored);
  }
})();
</script>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <span class="app-header__brand">HMIP</span>
    <div class="app-header__right">
      <span class="app-header__user" id="user-badge" hidden></span>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle theme">🖥</button>
      <button class="btn btn--ghost" id="logout-btn" type="button" hidden>Log out</button>
    </div>
  </header>

  <nav class="app-nav" id="app-nav" hidden>
    <a href="#/dashboard" data-route="dashboard"><span class="app-nav__icon">📊</span><span class="app-nav__label">Dashboard</span></a>
    <a href="#/portfolio" data-route="portfolio"><span class="app-nav__icon">💼</span><span class="app-nav__label">Portfolio</span></a>
    <a href="#/admin" data-route="admin" id="nav-admin" hidden><span class="app-nav__icon">⚙</span><span class="app-nav__label">Admin</span></a>
  </nav>

  <main class="app-main" id="app"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
