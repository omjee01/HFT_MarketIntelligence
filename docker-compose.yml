# Local dev infrastructure — MySQL (user/identity RDBMS), ClickHouse (analytics/
# transaction-signal store), Redis (cache + pub/sub), Kafka in KRaft mode (no
# ZooKeeper). Runs via Docker Desktop.
#
# Usage:
#   docker compose up -d --wait     # start everything, block until healthy
#   docker compose down             # stop (keeps data — named volumes persist)
#   docker compose down -v          # stop AND wipe all data
#
# Then run the app with the "docker" profile layered on "dev":
#   SPRING_PROFILES_ACTIVE=dev,docker,secrets ./gradlew bootRun
#
# All credentials below are LOCAL-DEV-ONLY defaults (bound to localhost, never
# exposed beyond this machine). Override any of them via a git-ignored .env
# file in this directory — see .env.example for the variable names.
#
# Host ports: MySQL is 3307 (not 3306) and Redis is 6380 (not 6379) — both
# default ports were already taken by other things on this machine when this
# was set up. Container-internal ports are untouched (3306/6379).

services:
  mysql:
    image: mysql:8.0
    container_name: hft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hft_dev_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hft_market_intelligence}
      MYSQL_USER: ${MYSQL_APP_USER:-hft_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-hft_dev_password}
    ports:
      - "3307:3306"   # host 3307: something else on this machine already owns 3306
    volumes:
      - hft_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-hft_dev_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: hft-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-hft_analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-hft_dev_clickhouse}
    ports:
      - "8123:8123"   # HTTP interface (used by the JDBC driver)
      - "9000:9000"   # native protocol (clickhouse-client)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - hft_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hft-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-hft_dev_redis}
    ports:
      - "6380:6379"   # host 6380: an unrelated container on this machine already owns 6379
    volumes:
      - hft_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "-a", "${REDIS_PASSWORD:-hft_dev_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:latest
    container_name: hft-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_INTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - hft_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  hft_mysql_data:
  hft_clickhouse_data:
  hft_redis_data:
  hft_kafka_data:
